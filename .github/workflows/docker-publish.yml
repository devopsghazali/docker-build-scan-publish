```yaml
name: Docker Build, Scan and Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: devopsghazali/docker-build-scan-publish

jobs:
  build-scan-publish:
    name: Build, Test, Scan and Publish
    runs-on: ubuntu-latest

    steps:
      # Repository ke us exact commit/tag ka code runner par lata hai
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker Buildx builder configure karta hai
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Image temporary commit SHA tag ke saath build hogi
      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${{ github.sha }}" \
            .

      # Built image ko run karke /healthz endpoint check karega
      - name: Run smoke test
        run: |
          sh scripts/smoke-test.sh \
            "${IMAGE_NAME}:${{ github.sha }}"

      # scripts/scan.sh exact built image ko Trivy se scan karega
      - name: Scan image with Trivy
        run: |
          sh scripts/scan.sh \
            "${IMAGE_NAME}:${{ github.sha }}"

      # Sirf version-tag workflow mein, scan pass hone ke baad
      # same image ko v1.0.0 jaisa release tag milega
      - name: Add release version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag \
            "${IMAGE_NAME}:${{ github.sha }}" \
            "${IMAGE_NAME}:${{ github.ref_name }}"

      # Login bhi sirf release tag par hoga
      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Scan pass hone ke baad version aur SHA dono push honge
      - name: Push approved image to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push "${IMAGE_NAME}:${{ github.ref_name }}"
          docker push "${IMAGE_NAME}:${{ github.sha }}"
```

