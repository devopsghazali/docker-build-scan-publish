name: Docker Build, Scan and Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: devopsghazali/docker-build-scan-publish

jobs:
  build-scan-publish:
    name: Build, Test, Scan and Publish
    runs-on: ubuntu-latest

    steps:
      # 1. Repository ke us exact commit/tag ka code runner par lata hai
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Saari git history lane ke liye taaki tags overwrite ho sakein

      # 2. Docker Buildx builder configure karta hai
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Image temporary commit SHA tag ke saath build होगी
      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${{ github.sha }}" \
            .

      # 4. Built image ko run karke /healthz endpoint check karega
      - name: Run smoke test
        run: |
          sh scripts/smoke-test.sh \
            "${IMAGE_NAME}:${{ github.sha }}"

      # 5. AUTOMATIC TRIVY INSTALLATION STEP
      # Ab aapko 'trivy: not found' ka error nahi aayega, yeh har baar fresh install hoga
      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      # 6. scripts/scan.sh se Trivy scan chalega
      - name: Scan image with Trivy
        run: |
          sh scripts/scan.sh \
            "${IMAGE_NAME}:${{ github.sha }}"

      # 7. Add Release Version Tag (Sirf tab chalega jab koi tag push karega)
      - name: Add release version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag \
            "${IMAGE_NAME}:${{ github.sha }}" \
            "${IMAGE_NAME}:${{ github.ref_name }}"

      # 8. Login to Docker Hub (Sirf tab chalega jab koi tag push karega)
      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9. Push approved image to Docker Hub (Sirf tab chalega jab koi tag push karega)
      - name: Push approved image to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push "${IMAGE_NAME}:${{ github.ref_name }}"
          docker push "${IMAGE_NAME}:${{ github.sha }}"
