name: docker-build-scan-publish

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t docker-build-scan-publish:${{ github.sha }} .
      - name: Scan image
        run: echo "Run Trivy here before pushing"
      - name: Publish tag
        run: echo "Push the approved image tag to your registry"
